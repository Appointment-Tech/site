# The mirrored HTML uses relative asset paths and *.html links (from
# wget --convert-links), but the hydrated TanStack Router client-side
# navigates to clean URLs (/empresas, not /empresas.html) via pushState.
# try_files covers both: a fresh request for /empresas resolves to
# empresas.html, and any already-.html request still works as-is.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The loading screen ships three inside preloader/scene.js (~715 kB raw,
    # ~185 kB gzipped) — serving it uncompressed would make the screen it is
    # supposed to decorate the slowest part of the page.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # This file only exists in the source tree as a doc, never copy it
    # into the served root's public surface.
    location = /README.md {
        return 404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
