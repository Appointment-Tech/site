# The mirrored HTML uses relative asset paths and *.html links (from
# wget --convert-links), but the hydrated TanStack Router client-side
# navigates to clean URLs (/empresas, not /empresas.html) via pushState.
# try_files covers both: a fresh request for /empresas resolves to
# empresas.html, and any already-.html request still works as-is.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This file only exists in the source tree as a doc, never copy it
    # into the served root's public surface.
    location = /README.md {
        return 404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
